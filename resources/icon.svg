<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E18"/>
      <stop offset="100%" stop-color="#24140A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Book Geometry -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Left Open Page -->
    <path d="M 256 360 C 210 330 140 330 80 345 L 80 145 C 140 130 210 130 256 160 Z" fill="url(#pageGrad)"/>
    <!-- Right Open Page -->
    <path d="M 256 360 C 302 330 372 330 432 345 L 432 145 C 372 130 302 130 256 160 Z" fill="url(#pageGrad)"/>
    <!-- Spine Center Crease -->
    <path d="M 254 160 L 254 360 L 258 360 L 258 160 Z" fill="#B45309" opacity="0.4"/>
    <!-- Book Bookmark Ribbon -->
    <path d="M 256 160 L 256 240 L 268 225 L 280 240 L 280 160 Z" fill="#DC2626"/>
    
    <!-- Left Page Subtle Lines -->
    <line x1="110" y1="180" x2="225" y2="180" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="110" y1="215" x2="225" y2="215" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="110" y1="250" x2="225" y2="250" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="110" y1="285" x2="185" y2="285" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

    <!-- Right Page Subtle Lines -->
    <line x1="285" y1="180" x2="400" y2="180" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="285" y1="215" x2="400" y2="215" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="285" y1="250" x2="400" y2="250" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="285" y1="285" x2="350" y2="285" stroke="#78350F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Glowing Stars / Dust above the book -->
  <polygon points="256,70 262,88 280,94 262,100 256,118 250,100 232,94 250,88" fill="url(#goldGrad)"/>
  <circle cx="160" cy="95" r="4" fill="#FDE68A" opacity="0.8"/>
  <circle cx="350" cy="85" r="5" fill="#FDE68A" opacity="0.8"/>
</svg>
